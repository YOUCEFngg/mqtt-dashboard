server:
  host: "0.0.0.0"
  port: 8081

mqtt:
  broker: "tcp://broker.hivemq.com:1883"
  client_id: "NegadYoucef-dashboard"
  username: ""
  password: ""

topics:
  - name: "temperature"
    topic: "rmbtech/interview/rug/NegadYoucef/sensors/temperature"
    interval: "3s"
    min_value: 20.0
    max_value: 35.0
    unit: "°C"

  - name: "humidity"
    topic: "rmbtech/interview/rug/NegadYoucef/sensors/humidity"
    interval: "5s"
    min_value: 30.0
    max_value: 80.0
    unit: "%"

  - name: "pressure"
    topic: "rmbtech/interview/rug/NegadYoucef/sensors/pressure"
    interval: "10s"
    min_value: 980.0
    max_value: 1030.0
    unit: "hPa"
